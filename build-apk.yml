name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TourCollectionManager-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project archive
        run: unzip -q TourCollectionManager-source.zip

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p TourCollectionManager assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tour-Collection-Manager-APK
          path: TourCollectionManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
