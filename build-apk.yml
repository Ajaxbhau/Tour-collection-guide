name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -q TourCollectionManager_CompileFix.zip

      - name: Use fixed MainActivity
        run: cp MainActivity.kt TourCollectionManager/app/src/main/java/com/tms/tourcollection/MainActivity.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p TourCollectionManager assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tour-Collection-Manager-APK
          path: TourCollectionManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tour Collection Manager v${{ github.run_number }}
          files: TourCollectionManager/app/build/outputs/apk/debug/app-debug.apk
